[package]
name = "acxs-manager"
version = "0.3.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "file"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "2.12.1", default-features = false }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[target."cfg(not(windows))".dependencies]
# rustls for HTTPS update checks on the test hosts.
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[target."cfg(windows)".dependencies]
# Windows TLS (SChannel) for HTTPS update checks: no C toolchain needed, system certificates.
native-tls = "0.2.14"
ureq = { version = "2.12.1", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
full_moon = { version = "3.0.0", features = ["lua52"] }
